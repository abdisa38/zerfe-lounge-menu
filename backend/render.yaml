services:
  - type: web
    name: gebeta-qr-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: CHAPA_SECRET_KEY
        sync: false
